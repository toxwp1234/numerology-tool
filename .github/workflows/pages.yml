name: Deploy website

# Publishes site/ plus the files from the latest GitHub Release to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Add latest release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null); then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir site --pattern 'numerology-tool*'
            sed -i "s/__VERSION__/${TAG}/g" site/index.html
          else
            echo "No release yet — deploying page without download files"
            sed -i "s/__VERSION__/coming soon/g" site/index.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
