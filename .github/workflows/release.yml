name: Release

# Wydanie nowej wersji:
#   1. podnieś "version" w firefox/manifest.json i chrome/manifest.json (np. 1.1)
#   2. git commit, potem: git tag v1.1 && git push origin main v1.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # tworzenie GitHub Release
  actions: write    # uruchomienie workflow strony

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check manifest versions match tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for m in firefox/manifest.json chrome/manifest.json; do
            V=$(jq -r .version "$m")
            if [ "$V" != "$TAG" ]; then
              echo "::error file=$m::version is $V but tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Lint Firefox extension
        run: npx --yes web-ext lint --source-dir firefox

      - name: Sign Firefox extension with Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir firefox \
            --artifacts-dir dist \
            --channel unlisted \
            --approval-timeout 900000

      - name: Package release files
        run: |
          mv dist/*.xpi dist/numerology-tool.xpi
          (cd chrome && zip -r ../dist/numerology-tool-chrome.zip .)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/numerology-tool.xpi
            dist/numerology-tool-chrome.zip

      # Tag nie może wdrażać na github-pages (ochrona środowiska), więc
      # odpalamy workflow strony na gałęzi main.
      - name: Update website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
