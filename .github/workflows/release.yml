name: Release

# To release a new version:
#   1. bump "version" in firefox/manifest.json and chrome/manifest.json (e.g. 1.1)
#   2. commit, then: git tag v1.1 && git push origin main v1.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check manifest versions match tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for m in firefox/manifest.json chrome/manifest.json; do
            V=$(jq -r .version "$m")
            if [ "$V" != "$TAG" ]; then
              echo "::error file=$m::version is $V but tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Lint Firefox extension
        run: npx --yes web-ext lint --source-dir firefox

      # Uploads the code to Mozilla. If approval takes longer than 10 min, or this
      # version was already uploaded (a re-run), the next step picks it up.
      - name: Sign Firefox extension with Mozilla (unlisted)
        id: sign
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir firefox \
            --artifacts-dir dist \
            --channel unlisted \
            --approval-timeout 600000

      - name: Wait for Mozilla approval and download signed file
        if: steps.sign.outcome == 'failure'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          WAIT_MINUTES: 90
        run: node scripts/fetch-signed-xpi.mjs

      - name: Package release files
        run: |
          mv dist/*.xpi dist/numerology-tool.xpi
          (cd chrome && zip -r ../dist/numerology-tool-chrome.zip .)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/numerology-tool.xpi
            dist/numerology-tool-chrome.zip

